<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html {
  height: 100%;
  box-sizing: border-box;
}

body {
  background-image: url(https://plus.unsplash.com/premium_photo-1704518704021-8a195b821d5c?q=80&w=1332&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D);
  background-size: cover;
}

.login-box {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 300px;
  padding: 40px;
  background: rgba(220,214,224,0.9);
  border-radius: 40px;
  box-shadow: 0 0 30px 20px rgba(0,0,0,0.3);
  border: 1px solid rgba(0,0,0,0.3);
  font-family: 'Noto Sans JP', sans-serif;
  color: white;
}

.login-box h2 {
  margin-top: 0;
  margin-bottom: 50px;
  text-align: center;
}

.blank {
  position: relative;
}

.blank input {
  width: 100%;
  font-size: 16px;
  padding: 10px 0;
  background-color: transparent;
  border: none;
  border-bottom: 2px solid #fff;
  margin-bottom: 40px;
  outline: none;
  color: #fff;
  position: relative;
  transition: 0.5s;
}

.blank label {
  position: absolute;
  top: 0;
  left: 0;
  font-size: 16px;
  padding: 10px 0;
  transition: 0.5s;
  pointer-events: none;
}

.blank input:focus {
  border-bottom: 2px solid #9d62a3;
  color: #9d62a3;
}

.blank input:focus ~ label, .blank input:valid ~ label, input:not(:placeholder-shown) ~ label {
  position: absolute;
  top: -25px;
  left: 0;
  font-size: 12px;
  color: #9d62a3;
  font-weight: bold;
  font-style: italic;
}

button {
  padding: 15px 25px;
  border-radius: 10px;
  border: 1px solid rgb(157,98,163, 0.8);
  color: #9d62a3;
  transition: 0.5s;
  margin: 10px 0;
  font-size: 15px;
}

button:active, button:hover {
  background-color: #9d62a3;
  color: #fff;
}

    </style>
</head>
    <body>
        <form class="login-box" action="/submit" method="POST">
          <h2>Login</h2>
          <div class="blank">
            <input type="text" name="name" required placeholder=" ">
            <label>Username</label>
          </div>
          <div class="blank">
            <input type="email" name="email" required placeholder=" ">
            <label>Email</label>
          </div>
          <div class="blank">
            <input type="password" name="password" required placeholder=" ">
            <label>Password</label>
          </div>
          <button type="submit">Login</button>
        </form>
      </body>
</html>
